<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #fafaf9; }
    .fg { fill: #111114; }
    .accent { fill: #7745d8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0b0c; }
      .fg { fill: #f4f4f5; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6" />
  <!-- Bold "A": apex at y=9 (leaves space for a floating dot above) -->
  <path class="fg" d="M16 9 L25 27 H21.4 L19.55 23.3 H12.45 L10.6 27 H7 L16 9 Z M13.6 20.6 H18.4 L16 15.5 L13.6 20.6 Z" />
  <!-- Iris accent dot floating above, with breathing room -->
  <circle class="accent" cx="16" cy="5.5" r="1.6" />
</svg>
